<svg xmlns="http://www.w3.org/2000/svg" width="520" height="420" viewBox="0 0 520 420" role="img" aria-labelledby="t d"><title id="t">GSD Dashboard, routing and guardrails</title><desc id="d">GSD Dashboard: a question goes to a Logistic Regression router (routing accuracy 88% to 98% on a 45-query blind set). One-domain questions go to the lease, capex and procurement pipelines; cross-module ones go to a tool-calling agent with 24 tools and at most 10 steps. Either way the SQL reaches the registers through three guardrails: a constrained prompt, a SELECT-only validator and a read-only transaction.</desc><style>@font-face{font-family:'mn4';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'mn6';font-weight:600;font-style:normal;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'jb4';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2');}</style><rect x=".75" y=".75" width="518.5" height="418.5" rx="12" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/>
