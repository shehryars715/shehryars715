<text x="389.00" y="166.00" font-family="mn4" font-size="18" font-weight="400" font-style="normal" fill="#59636e" text-anchor="start">no: stop,</text>
<text x="389.00" y="190.00" font-family="mn4" font-size="18" font-weight="400" font-style="normal" fill="#59636e" text-anchor="start">say why</text>
