<svg xmlns="http://www.w3.org/2000/svg" width="520" height="468" viewBox="0 0 520 468" role="img" aria-labelledby="t d"><title id="t">Labs-Agent, the harness</title><desc id="d">Labs-Agent flowchart: a lab manual is read in one LLM call; gates check it can run here, and stop with a reason if not; then the agent writes taskN.py and runs it. If the exit code is 0 the task has passed and becomes your files; if not, it reads the error, fixes the code and writes again.</desc><style>@font-face{font-family:'mn4';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'jb4';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'mn6';font-weight:600;font-style:normal;src:url(data:font/woff2;base64,) format('woff2');}</style><rect x=".75" y=".75" width="518.5" height="466.5" rx="12" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/>
<rect x="165.0" y="22.0" width="190.0" height="40" rx="4" fill="#ffffff" stroke="#1f2328" stroke-width="1.2"/>
<text x="260.00" y="48.48" font-family="mn4" font-size="18" font-weight="400" font-style="normal" fill="#1f2328" text-anchor="middle">lab manual</text>
