<text x="260.00" y="112.48" font-family="mn4" font-size="18" font-weight="400" font-style="normal" fill="#1f2328" text-anchor="middle">one LLM call</text>
<rect x="165.0" y="150.0" width="190.0" height="40" rx="4" fill="#ffffff" stroke="#1f2328" stroke-width="1.2"/>
<text x="260.00" y="176.48" font-family="mn4" font-size="18" font-weight="400" font-style="normal" fill="#1f2328" text-anchor="middle">gates</text>
<rect x="165.0" y="214.0" width="190.0" height="40" rx="4" fill="#ffffff" stroke="#1f2328" stroke-width="1.2"/>
<text x="260.00" y="240.48" font-family="jb4" font-size="18" font-weight="400" font-style="normal" fill="#1f2328" text-anchor="middle">write taskN.py</text>
<rect x="165.0" y="278.0" width="190.0" height="40" rx="4" fill="#ffffff" stroke="#1f2328" stroke-width="1.2"/>
